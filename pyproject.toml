[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "medisense"
version = "5.2.0"
description = "Computer-vision based bedridden patient safety monitor (portfolio project)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python==4.10.0.84",
    "mediapipe==0.10.14",
    "numpy==1.26.4",
    "Pillow==10.4.0",
    "transformers==4.44.2",
    "torch==2.4.0",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "ultralytics>=8.2.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.2"]

[project.scripts]
medisense = "medisense.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
